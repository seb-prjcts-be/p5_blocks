<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>p5* Blocks</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Nunito:wght@700;900&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    /* ── Reset & base ────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --p5-pink:    #ED225D;
      --p5-pink-dk: #c41a4f;
      --bg:         #f5f5f5;
      --bg-panel:   #ffffff;
      --bg-palette: #efefef;
      --bg-zone:    #fafafa;
      --border:     rgba(0,0,0,.1);
      --text:       #333;
      --text-dim:   #888;
      --mono:       'Source Code Pro', 'Fira Code', monospace;
      --ui:         'Nunito', 'Segoe UI', sans-serif;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--ui); overflow: hidden; }

    /* ── Scrollbar ───────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); border-radius: 3px; }

    /* ── Layout ──────────────────────────────────────────────────── */
    #app { display: flex; flex-direction: column; height: 100vh; }

    #toolbar {
      height: 46px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px; padding: 0 14px;
      flex-shrink: 0; z-index: 10;
    }

    #body { flex: 1; display: flex; overflow: hidden; min-height: 0; }

    /* ── Toolbar elements ────────────────────────────────────────── */
    .logo {
      font-family: var(--ui); font-size: 21px; font-weight: 900;
      font-style: italic; color: var(--p5-pink); letter-spacing: -1px;
      text-decoration: none; line-height: 1; padding: 0 2px; flex-shrink: 0;
    }
    .logo span { color: #222; }

    .t-divider { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }
    .t-spacer  { flex: 1; }

    .btn-run {
      background: var(--p5-pink); border: none; color: #fff;
      border-radius: 6px; padding: 5px 16px; font-size: 13px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; gap: 5px;
      font-family: var(--ui); transition: background .15s; flex-shrink: 0;
    }
    .btn-run:hover { background: var(--p5-pink-dk); }

    .btn-secondary {
      background: rgba(0,0,0,.05); border: 1px solid var(--border);
      color: #666; border-radius: 6px; padding: 5px 12px; font-size: 12px;
      cursor: pointer; font-family: var(--ui); transition: all .15s;
      display: flex; align-items: center; gap: 5px; flex-shrink: 0;
    }
    .btn-secondary:hover { background: rgba(0,0,0,.09); color: #333; }
    .btn-secondary.active { background: #ED225D18; color: var(--p5-pink); border-color: #ED225D55; }

    #sketch-name {
      background: transparent; border: 1px solid transparent; color: #555;
      font-size: 13px; padding: 3px 8px; border-radius: 4px; outline: none;
      font-family: var(--ui); max-width: 150px; transition: border-color .15s;
    }
    #sketch-name:focus { border-color: var(--border); background: rgba(0,0,0,.03); color: #222; }

    .preset-select {
      background: rgba(0,0,0,.04); border: 1px solid var(--border);
      color: #666; border-radius: 6px; padding: 5px 8px; font-size: 12px;
      cursor: pointer; font-family: var(--ui); outline: none;
    }
    .preset-select option { background: #fff; }

    /* ── Palette (left) ──────────────────────────────────────────── */
    #palette {
      width: 230px; flex-shrink: 0;
      background: var(--bg-palette);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }

    #cat-list {
      padding: 8px 7px 4px;
      display: flex; flex-direction: column; gap: 1px;
      flex-shrink: 0;
    }

    .cat-btn {
      display: flex; align-items: center; gap: 9px;
      padding: 6px 10px; border-radius: 6px; border: none;
      background: transparent; color: #888; font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: var(--ui); transition: all .12s; text-align: left;
      width: 100%;
    }
    .cat-btn:hover { background: rgba(0,0,0,.05); color: #444; }
    .cat-btn.active { color: #222; }

    .cat-dot {
      width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0;
    }

    #block-list {
      flex: 1; overflow-y: auto; padding: 4px 8px 8px;
      border-top: 1px solid var(--border);
    }

    /* ── Palette blocks (draggable source) ───────────────────────── */
    .pal-block {
      display: flex; align-items: center; gap: 7px;
      padding: 7px 10px; margin-bottom: 3px; border-radius: 6px;
      font-family: var(--mono); font-size: 12px; font-weight: 600; color: #fff;
      cursor: grab; user-select: none;
      transition: transform .1s, box-shadow .1s;
    }
    .pal-block:hover { transform: translateY(-1px); }
    .pal-block:active { transform: none; }

    /* Scratch-style notch indicator */
    .pal-block::before {
      content: '';
      display: block; width: 8px; height: 8px; flex-shrink: 0;
      border-radius: 50%; background: rgba(0,0,0,.25);
      border: 2px solid rgba(255,255,255,.2);
    }

    /* ── Workspace (center) ──────────────────────────────────────── */
    #workspace {
      flex: 1; display: flex; min-width: 0; overflow: hidden;
    }

    #zones {
      flex: 1; overflow-y: auto; padding: 16px 18px;
      display: flex; flex-direction: column; gap: 20px;
    }

    /* ── Zone (setup / draw) ─────────────────────────────────────── */
    .zone-header {
      font-family: var(--mono); font-size: 13px; margin-bottom: 6px;
      display: flex; align-items: center; gap: 6px;
    }
    .kw-function { color: #a626a4; }
    .kw-name     { color: #4078f2; font-weight: 700; }
    .kw-punc     { color: #aaa; }

    .zone-body {
      margin-left: 14px;
      min-height: 52px; border-radius: 6px;
      border: 2px dashed rgba(0,0,0,.12);
      background: rgba(0,0,0,.02);
      padding: 4px; transition: border-color .15s, background .15s;
    }
    .zone-body.drag-over {
      border-color: var(--p5-pink);
      background: rgba(237,34,93,.04);
    }

    .zone-empty {
      color: rgba(0,0,0,.2); font-size: 12px;
      text-align: center; padding: 12px; font-family: var(--mono);
      pointer-events: none;
    }

    .zone-footer {
      font-family: var(--mono); font-size: 13px;
      color: #aaa; margin-left: 14px; margin-top: 4px;
    }

    /* ── Workspace blocks ────────────────────────────────────────── */
    .ws-block {
      display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
      padding: 5px 8px 5px 12px; margin-bottom: 2px; border-radius: 5px;
      font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: #fff;
      cursor: grab; user-select: none; position: relative;
    }
    .ws-block:last-child { margin-bottom: 0; }
    .ws-block.dragging { opacity: .4; }

    /* Scratch-style left notch */
    .ws-block::before {
      content: ''; position: absolute;
      left: 0; top: 50%; transform: translateY(-50%);
      width: 5px; height: 16px;
      background: rgba(0,0,0,.2); border-radius: 0 4px 4px 0;
    }

    .drop-line {
      height: 3px; background: var(--p5-pink); border-radius: 2px;
      margin: 1px 0; pointer-events: none;
    }

    .block-fn   { font-weight: 700; white-space: nowrap; }
    .block-punc { color: rgba(255,255,255,.5); font-size: 11px; }

    .block-input {
      background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.15);
      border-radius: 4px; color: #fff; padding: 1px 6px;
      font-family: var(--mono); font-size: 12px; outline: none;
      min-width: 28px; transition: border-color .1s, background .1s;
    }
    .block-input:focus { border-color: rgba(255,255,255,.4); }
    /* Highlight when an expression block hovers over this input */
    .block-input.expr-over {
      border-color: #fff !important;
      background: rgba(255,255,255,.28) !important;
      cursor: copy;
    }

    /* Expression (reporter) blocks — pill shape, like Scratch */
    .pal-block.expr {
      border-radius: 20px;
      padding-left: 14px; padding-right: 14px;
    }
    .pal-block.expr::before { display: none; }

    .block-del {
      margin-left: auto; background: rgba(0,0,0,.25); border: none;
      color: rgba(255,255,255,.45); border-radius: 50%;
      width: 18px; height: 18px; cursor: pointer; font-size: 14px; line-height: 1;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      transition: all .1s;
    }
    .block-del:hover { background: rgba(237,34,93,.6); color: #fff; }

    /* ── Code panel ──────────────────────────────────────────────── */
    #code-panel {
      width: 300px; flex-shrink: 0;
      background: #fafafa; border-left: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    #code-panel.hidden { display: none; }

    #code-panel-header {
      padding: 8px 12px; border-bottom: 1px solid var(--border);
      font-size: 11px; font-weight: 700; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: .8px;
    }

    #code-pre {
      flex: 1; overflow: auto; margin: 0;
      font-family: var(--mono); font-size: 12px; line-height: 1.65;
      color: #383a42; padding: 12px 14px; white-space: pre;
    }

    #btn-copy-code {
      margin: 8px; flex-shrink: 0;
      background: rgba(0,0,0,.05); border: 1px solid var(--border);
      color: #777; border-radius: 5px; padding: 6px; font-size: 12px;
      cursor: pointer; font-family: var(--ui); transition: all .15s;
    }
    #btn-copy-code:hover { background: rgba(0,0,0,.09); color: #333; }

    /* ── Preview (right) ─────────────────────────────────────────── */
    #preview {
      width: 430px; flex-shrink: 0;
      background: #f0f0f0; border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
    }

    #preview-header {
      height: 36px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 12px; gap: 8px;
      font-size: 11px; font-weight: 700; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: .8px; flex-shrink: 0;
      background: #fff;
    }

    #preview-frame {
      flex: 1; border: none; background: #f0f0f0; display: block;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Toolbar ────────────────────────────────────────────────── -->
  <div id="toolbar">
    <a class="logo" href="#" title="p5.js Blocks">p5<span>*</span></a>
    <div class="t-divider"></div>
    <input id="sketch-name" type="text" value="mijn_sketch" spellcheck="false" />
    <div class="t-divider"></div>
    <button class="btn-run" id="btn-run"><i class="bi bi-play-fill"></i> Run</button>
    <button class="btn-secondary" id="btn-stop"><i class="bi bi-stop-fill"></i> Stop</button>
    <div class="t-spacer"></div>
    <button class="btn-secondary" id="btn-code"><i class="bi bi-code-slash"></i> Code</button>
    <div class="t-divider"></div>
    <select class="preset-select" id="preset-select">
      <option value="">Voorbeelden…</option>
      <option value="leeg">Leeg</option>
      <option value="regenboog">Regenboog</option>
      <option value="muis_volger">Muis volger</option>
    </select>
  </div>

  <!-- ── Body ──────────────────────────────────────────────────── -->
  <div id="body">

    <!-- Left: palette -->
    <div id="palette">
      <div id="cat-list"></div>
      <div id="block-list"></div>
    </div>

    <!-- Center: workspace -->
    <div id="workspace">
      <div id="zones">
        <div class="zone-wrap">
          <div class="zone-header">
            <span class="kw-function">function</span>
            <span class="kw-name">setup</span>
            <span class="kw-punc">() {</span>
          </div>
          <div class="zone-body" data-zone="setup"></div>
          <div class="zone-footer">}</div>
        </div>

        <div class="zone-wrap">
          <div class="zone-header">
            <span class="kw-function">function</span>
            <span class="kw-name">draw</span>
            <span class="kw-punc">() {</span>
          </div>
          <div class="zone-body" data-zone="draw"></div>
          <div class="zone-footer">}</div>
        </div>
      </div>

      <!-- Code panel (collapsible) -->
      <div id="code-panel" class="hidden">
        <div id="code-panel-header">Gegenereerde code</div>
        <pre id="code-pre"></pre>
        <button id="btn-copy-code"><i class="bi bi-clipboard"></i> Kopieer naar klembord</button>
      </div>
    </div>

    <!-- Right: preview -->
    <div id="preview">
      <div id="preview-header">
        <i class="bi bi-display"></i> Preview
      </div>
      <iframe id="preview-frame" sandbox="allow-scripts" title="p5.js preview"></iframe>
    </div>

  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════════════

const CATEGORIES = {
  setup: {
    label: 'Setup', color: '#FBBF2E',
    blocks: [
      { type: 'createCanvas',  label: 'createCanvas',  params: [{name:'w',def:'400'},{name:'h',def:'400'}],           code: p=>`createCanvas(${p.w}, ${p.h});` },
      { type: 'background',    label: 'background',    params: [{name:'c',def:'220'}],                                code: p=>`background(${p.c});` },
      { type: 'frameRate',     label: 'frameRate',     params: [{name:'fps',def:'30'}],                               code: p=>`frameRate(${p.fps});` },
    ]
  },
  shapes: {
    label: 'Vormen', color: '#0091D1',
    blocks: [
      { type: 'ellipse',  label: 'ellipse',  params: [{name:'x',def:'200'},{name:'y',def:'200'},{name:'w',def:'80'},{name:'h',def:'80'}],    code: p=>`ellipse(${p.x}, ${p.y}, ${p.w}, ${p.h});` },
      { type: 'circle',   label: 'circle',   params: [{name:'x',def:'200'},{name:'y',def:'200'},{name:'d',def:'100'}],                       code: p=>`circle(${p.x}, ${p.y}, ${p.d});` },
      { type: 'rect',     label: 'rect',     params: [{name:'x',def:'50'},{name:'y',def:'50'},{name:'w',def:'100'},{name:'h',def:'80'}],     code: p=>`rect(${p.x}, ${p.y}, ${p.w}, ${p.h});` },
      { type: 'line',     label: 'line',     params: [{name:'x1',def:'0'},{name:'y1',def:'0'},{name:'x2',def:'200'},{name:'y2',def:'200'}],  code: p=>`line(${p.x1}, ${p.y1}, ${p.x2}, ${p.y2});` },
      { type: 'triangle', label: 'triangle', params: [{name:'x1',def:'100'},{name:'y1',def:'50'},{name:'x2',def:'50'},{name:'y2',def:'150'},{name:'x3',def:'150'},{name:'y3',def:'150'}], code: p=>`triangle(${p.x1},${p.y1},${p.x2},${p.y2},${p.x3},${p.y3});` },
      { type: 'point',    label: 'point',    params: [{name:'x',def:'100'},{name:'y',def:'100'}],                                            code: p=>`point(${p.x}, ${p.y});` },
      { type: 'arc',      label: 'arc',      params: [{name:'x',def:'200'},{name:'y',def:'200'},{name:'w',def:'100'},{name:'h',def:'100'},{name:'start',def:'0'},{name:'stop',def:'PI'}], code: p=>`arc(${p.x},${p.y},${p.w},${p.h},${p.start},${p.stop});` },
    ]
  },
  kleur: {
    label: 'Kleur', color: '#E23D96',
    blocks: [
      { type: 'fill',         label: 'fill',         params: [{name:'r',def:'255'},{name:'g',def:'100'},{name:'b',def:'50'}],  code: p=>`fill(${p.r}, ${p.g}, ${p.b});` },
      { type: 'stroke',       label: 'stroke',       params: [{name:'r',def:'0'},{name:'g',def:'0'},{name:'b',def:'0'}],       code: p=>`stroke(${p.r}, ${p.g}, ${p.b});` },
      { type: 'strokeWeight', label: 'strokeWeight', params: [{name:'w',def:'2'}],                                             code: p=>`strokeWeight(${p.w});` },
      { type: 'noFill',       label: 'noFill',       params: [],                                                               code: ()=>'noFill();' },
      { type: 'noStroke',     label: 'noStroke',     params: [],                                                               code: ()=>'noStroke();' },
      { type: 'colorMode',    label: 'colorMode',    params: [{name:'mode',def:'HSB'}],                                        code: p=>`colorMode(${p.mode});` },
    ]
  },
  transform: {
    label: 'Transform', color: '#69619B',
    blocks: [
      { type: 'translate', label: 'translate', params: [{name:'x',def:'100'},{name:'y',def:'100'}], code: p=>`translate(${p.x}, ${p.y});` },
      { type: 'rotate',    label: 'rotate',    params: [{name:'a',def:'PI/4'}],                     code: p=>`rotate(${p.a});` },
      { type: 'scale',     label: 'scale',     params: [{name:'s',def:'1.5'}],                      code: p=>`scale(${p.s});` },
      { type: 'push',      label: 'push',      params: [],                                          code: ()=>'push();' },
      { type: 'pop',       label: 'pop',       params: [],                                          code: ()=>'pop();' },
    ]
  },
  interactie: {
    label: 'Interactie', color: '#EF4424',
    blocks: [
      { type: 'text',     label: 'text',     params: [{name:'txt',def:"'Hallo!'"},{name:'x',def:'50'},{name:'y',def:'50'}], code: p=>`text(${p.txt}, ${p.x}, ${p.y});` },
      { type: 'textSize', label: 'textSize', params: [{name:'s',def:'32'}],                                                 code: p=>`textSize(${p.s});` },
      { type: 'mouseX',   label: 'mouseX',   params: [], isExpr: true,                                                     code: ()=>'mouseX' },
      { type: 'mouseY',   label: 'mouseY',   params: [], isExpr: true,                                                     code: ()=>'mouseY' },
    ]
  },
  wiskunde: {
    label: 'Wiskunde', color: '#61B199',
    blocks: [
      { type: 'random', label: 'random', params: [{name:'min',def:'0'},{name:'max',def:'400'}],                                                             isExpr: true, code: p=>`random(${p.min}, ${p.max})` },
      { type: 'map',    label: 'map',    params: [{name:'v',def:'mouseX'},{name:'a',def:'0'},{name:'b',def:'400'},{name:'c',def:'0'},{name:'d',def:'255'}], isExpr: true, code: p=>`map(${p.v},${p.a},${p.b},${p.c},${p.d})` },
      { type: 'sin',    label: 'sin',    params: [{name:'a',def:'frameCount*0.05'}], isExpr: true, code: p=>`sin(${p.a})` },
      { type: 'cos',    label: 'cos',    params: [{name:'a',def:'frameCount*0.05'}], isExpr: true, code: p=>`cos(${p.a})` },
      { type: 'noise',  label: 'noise',  params: [{name:'x',def:'frameCount*0.01'}], isExpr: true, code: p=>`noise(${p.x})` },
    ]
  },
  controle: {
    label: 'Controle', color: '#F3722E',
    blocks: [
      { type: 'for_loop', label: 'for',  isCtrl: true, params: [{name:'v',def:'i'},{name:'start',def:'0'},{name:'end',def:'10'},{name:'step',def:'1'}], code: p=>`for (let ${p.v} = ${p.start}; ${p.v} < ${p.end}; ${p.v} += ${p.step}) {` },
      { type: 'if_block', label: 'if',   isCtrl: true, params: [{name:'cond',def:'mouseIsPressed'}],                                                   code: p=>`if (${p.cond}) {` },
    ]
  },
};

function findDef(type) {
  for (const cat of Object.values(CATEGORIES)) {
    const b = cat.blocks.find(b => b.type === type);
    if (b) return { ...b, color: cat.color };
  }
  return null;
}

// ── State ──────────────────────────────────────────────────────
let _uid = 0;
const newId = () => `b${++_uid}`;

const state = {
  setup: [], draw: [],
  activeCat: 'shapes',
  showCode: false,
  dragItem: null,
  dropTarget: null,
};

// ── Presets ────────────────────────────────────────────────────
function makeBlock(type, overrides = {}) {
  const def = findDef(type);
  const vals = {};
  def.params.forEach(p => { vals[p.name] = overrides[p.name] ?? p.def; });
  return { id: newId(), type, values: vals };
}

const PRESETS = {
  leeg: { setup: [], draw: [] },
  regenboog: {
    setup: [
      makeBlock('createCanvas', {w:'400',h:'400'}),
      makeBlock('colorMode', {mode:'HSB'}),
    ],
    draw: [
      makeBlock('background', {c:'0, 0, 20'}),
      makeBlock('for_loop', {v:'i',start:'0',end:'36',step:'1'}),
      makeBlock('fill', {r:'i*10',g:'255',b:'255'}),
      makeBlock('noStroke'),
      makeBlock('circle', {x:'200+cos(i*TWO_PI/36)*150', y:'200+sin(i*TWO_PI/36)*150', d:'40'}),
    ],
  },
  muis_volger: {
    setup: [ makeBlock('createCanvas', {w:'400',h:'400'}) ],
    draw: [
      makeBlock('background', {c:'245, 245, 245'}),
      makeBlock('fill', {r:'100',g:'200',b:'255'}),
      makeBlock('noStroke'),
      makeBlock('circle', {x:'mouseX',y:'mouseY',d:'60'}),
      makeBlock('fill', {r:'255',g:'100',b:'150'}),
      makeBlock('circle', {x:'mouseX+30',y:'mouseY-30',d:'30'}),
    ],
  },
};

// ═══════════════════════════════════════════════════════════════
// CODE GENERATION
// ═══════════════════════════════════════════════════════════════

function generateCode() {
  const ind = (s, n) => '  '.repeat(n) + s;

  function process(blocks) {
    const lines = [];
    let lvl = 1;
    const expanded = [];
    const stack = [];
    for (const b of blocks) {
      expanded.push(b);
      if (findDef(b.type)?.isCtrl) stack.push('_close');
    }
    while (stack.length) expanded.push({ _close: true });

    for (const b of expanded) {
      if (b._close) {
        lvl = Math.max(1, lvl - 1);
        lines.push(ind('}', lvl));
        continue;
      }
      const def = findDef(b.type);
      if (!def) continue;
      lines.push(ind(def.code(b.values), lvl));
      if (def.isCtrl) lvl++;
    }
    return lines.join('\n');
  }

  return `function setup() {\n${process(state.setup)}\n}\n\nfunction draw() {\n${process(state.draw)}\n}`;
}

// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════

function darken(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgb(${Math.round(r*.55)},${Math.round(g*.55)},${Math.round(b*.55)})`;
}

function renderCategories() {
  const el = document.getElementById('cat-list');
  el.innerHTML = '';
  for (const [key, cat] of Object.entries(CATEGORIES)) {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (key === state.activeCat ? ' active' : '');
    if (key === state.activeCat) btn.style.background = cat.color + '22';
    btn.innerHTML = `<span class="cat-dot" style="background:${cat.color}"></span>${cat.label}`;
    btn.onclick = () => { state.activeCat = key; renderCategories(); renderBlockList(); };
    el.appendChild(btn);
  }
}

function renderBlockList() {
  const el = document.getElementById('block-list');
  el.innerHTML = '';
  const cat = CATEGORIES[state.activeCat];
  if (!cat) return;

  cat.blocks.forEach(block => {
    const div = document.createElement('div');
    div.className = 'pal-block';
    div.style.background = cat.color;
    div.style.boxShadow = `0 3px 0 ${darken(cat.color)}, inset 0 1px 0 rgba(255,255,255,.12)`;
    div.draggable = true;

    let inner = `<span>${block.label}</span>`;
    if (block.params.length) {
      inner += `<span style="color:rgba(255,255,255,.5);font-size:11px">(${block.params.map(p=>p.name).join(', ')})</span>`;
    }
    div.innerHTML = inner;

    if (block.isExpr) div.classList.add('expr');

    div.addEventListener('dragstart', e => {
      const vals = {};
      block.params.forEach(p => vals[p.name] = p.def);
      state.dragItem = { type: block.type, color: cat.color, values: vals, source: 'palette', isExpr: !!block.isExpr };
      e.dataTransfer.effectAllowed = 'copy';
    });
    div.addEventListener('dragend', () => {
      state.dragItem = null;
      state.dropTarget = null;
      renderZones();
    });
    el.appendChild(div);
  });
}

function renderZones() {
  renderZone('setup');
  renderZone('draw');
}

function renderZone(zone) {
  const body = document.querySelector(`.zone-body[data-zone="${zone}"]`);
  const blocks = state[zone];
  body.innerHTML = '';

  if (blocks.length === 0) {
    body.innerHTML = '<div class="zone-empty">Sleep blokken hierheen…</div>';
  }

  blocks.forEach((block, idx) => {
    if (state.dropTarget?.zone === zone && state.dropTarget?.idx === idx) {
      body.appendChild(makeDropLine());
    }

    const def = findDef(block.type);
    if (!def) return;

    const div = document.createElement('div');
    div.className = 'ws-block';
    div.style.background = def.color;
    div.style.boxShadow = `0 3px 0 ${darken(def.color)}, inset 0 1px 0 rgba(255,255,255,.1)`;
    div.draggable = true;

    // Function name
    const fnSpan = document.createElement('span');
    fnSpan.className = 'block-fn';
    fnSpan.textContent = def.label;
    div.appendChild(fnSpan);

    if (def.params.length) {
      div.appendChild(punc('('));
      def.params.forEach((p, pi) => {
        if (pi > 0) div.appendChild(punc(', '));
        const inp = document.createElement('input');
        inp.className = 'block-input';
        inp.value = block.values[p.name] ?? p.def;
        inp.style.width = inputWidth(inp.value);
        inp.addEventListener('input', e => {
          e.stopPropagation();
          block.values[p.name] = e.target.value;
          e.target.style.width = inputWidth(e.target.value);
          scheduleRun();
          updateCodePanel();
        });
        inp.addEventListener('click', e => e.stopPropagation());
        inp.addEventListener('mousedown', e => e.stopPropagation());

        // Drop expression blocks into this parameter slot
        inp.addEventListener('dragover', e => {
          if (!state.dragItem?.isExpr) return;
          e.preventDefault(); e.stopPropagation();
          inp.classList.add('expr-over');
        });
        inp.addEventListener('dragleave', () => inp.classList.remove('expr-over'));
        inp.addEventListener('drop', e => {
          if (!state.dragItem?.isExpr) return;
          e.preventDefault(); e.stopPropagation();
          const exprDef = findDef(state.dragItem.type);
          const code = exprDef.code(state.dragItem.values);
          block.values[p.name] = code;
          inp.value = code;
          inp.style.width = inputWidth(code);
          inp.classList.remove('expr-over');
          state.dragItem = null;
          state.dropTarget = null;
          scheduleRun();
          updateCodePanel();
        });

        div.appendChild(inp);
      });
      const closing = def.isCtrl ? ') {' : (def.isExpr ? ')' : ');');
      div.appendChild(punc(closing));
    } else {
      if (def.isCtrl) div.appendChild(punc(' {'));
      else if (!def.isExpr) div.appendChild(punc(';'));
    }

    // Delete button
    const del = document.createElement('button');
    del.className = 'block-del';
    del.innerHTML = '&times;';
    del.title = 'Verwijder';
    del.addEventListener('click', e => {
      e.stopPropagation();
      state[zone].splice(idx, 1);
      renderZones();
      scheduleRun();
    });
    div.appendChild(del);

    // Drag from workspace
    div.addEventListener('dragstart', e => {
      state.dragItem = { ...block, color: def.color, source: 'workspace', sourceZone: zone, sourceIdx: idx };
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => div.classList.add('dragging'), 0);
    });
    div.addEventListener('dragend', () => {
      div.classList.remove('dragging');
      state.dragItem = null;
      state.dropTarget = null;
      renderZones();
    });
    div.addEventListener('dragover', e => {
      if (state.dragItem?.isExpr) return;
      e.preventDefault(); e.stopPropagation();
      if (state.dropTarget?.zone !== zone || state.dropTarget?.idx !== idx) {
        state.dropTarget = { zone, idx };
        renderZones();
      }
    });

    body.appendChild(div);
  });

  // Drop line at end
  if (state.dropTarget?.zone === zone && state.dropTarget?.idx === blocks.length) {
    body.appendChild(makeDropLine());
  }

  body.classList.toggle('drag-over', state.dropTarget?.zone === zone);

  body.addEventListener('dragover', e => {
    if (state.dragItem?.isExpr) return;
    e.preventDefault();
    if (!state.dropTarget || state.dropTarget.zone !== zone) {
      state.dropTarget = { zone, idx: blocks.length };
      renderZones();
    }
  });
  body.addEventListener('dragleave', e => {
    if (!body.contains(e.relatedTarget)) {
      state.dropTarget = null;
      renderZones();
    }
  });
  body.addEventListener('drop', e => {
    e.preventDefault();
    handleDrop(zone);
  });
}

function punc(text) {
  const s = document.createElement('span');
  s.className = 'block-punc';
  s.textContent = text;
  return s;
}

function inputWidth(val) {
  return Math.max(28, val.length * 7.5 + 14) + 'px';
}

function makeDropLine() {
  const d = document.createElement('div');
  d.className = 'drop-line';
  return d;
}

function handleDrop(zone) {
  const item = state.dragItem;
  if (!item) return;
  const targetIdx = state.dropTarget?.idx ?? state[zone].length;

  if (item.source === 'palette') {
    state[zone].splice(targetIdx, 0, { id: newId(), type: item.type, values: { ...item.values } });
  } else {
    const src = state[item.sourceZone];
    const [removed] = src.splice(item.sourceIdx, 1);
    const dest = state[zone];
    const adj = (item.sourceZone === zone && item.sourceIdx < targetIdx) ? targetIdx - 1 : targetIdx;
    dest.splice(Math.max(0, adj), 0, { ...removed });
  }

  state.dragItem = null;
  state.dropTarget = null;
  renderZones();
  scheduleRun();
}

function updateCodePanel() {
  if (!state.showCode) return;
  document.getElementById('code-pre').textContent = generateCode();
}

// ═══════════════════════════════════════════════════════════════
// PREVIEW
// ═══════════════════════════════════════════════════════════════

let runTimer = null;

function scheduleRun() {
  clearTimeout(runTimer);
  runTimer = setTimeout(runSketch, 400);
}

function runSketch() {
  const code = generateCode();
  document.getElementById('preview-frame').srcdoc =
    `<!DOCTYPE html><html><head><meta charset="UTF-8"/>
<style>html,body{margin:0;overflow:hidden;background:#f0f0f0;}canvas{display:block;}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"><\/script>
</head><body><script>${code}<\/script></body></html>`;
}

function loadPreset(name) {
  _uid = 0;
  const p = PRESETS[name];
  if (!p) return;
  state.setup = p.setup.map(b => ({ ...b, id: newId(), values: { ...b.values } }));
  state.draw  = p.draw.map(b => ({ ...b, id: newId(), values: { ...b.values } }));
  renderZones();
  scheduleRun();
}

// ═══════════════════════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════════════════════

document.getElementById('btn-run').addEventListener('click', () => {
  renderZones();
  runSketch();
});

document.getElementById('btn-stop').addEventListener('click', () => {
  document.getElementById('preview-frame').srcdoc = '';
  clearTimeout(runTimer);
});

document.getElementById('btn-code').addEventListener('click', () => {
  state.showCode = !state.showCode;
  document.getElementById('code-panel').classList.toggle('hidden', !state.showCode);
  document.getElementById('btn-code').classList.toggle('active', state.showCode);
  updateCodePanel();
});

document.getElementById('btn-copy-code').addEventListener('click', () => {
  navigator.clipboard?.writeText(generateCode());
});

document.getElementById('preset-select').addEventListener('change', function () {
  if (this.value) { loadPreset(this.value); this.value = ''; }
});

// ── Init ───────────────────────────────────────────────────────
renderCategories();
loadPreset('muis_volger');
</script>
</body>
</html>
