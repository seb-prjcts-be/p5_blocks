<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>p5* Blocks</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;700&family=Source+Code+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Nunito:wght@700;900&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- ── Header ─────────────────────────────────────────────────── -->
  <header>
    <div class="header-main">
      <a class="site-title-link" href="#">
        <h1>p5* Blocks</h1>
        <div class="subtitle">Visueel programmeren met p5.js</div>
      </a>
    </div>
  </header>

  <!-- ── Toolbar ────────────────────────────────────────────────── -->
  <div id="toolbar">
    <input id="sketch-name" type="text" value="mijn_sketch" spellcheck="false" />
    <div class="t-divider"></div>
    <button class="btn-run" id="btn-run"><i class="bi bi-play-fill"></i> Run</button>
    <button class="btn-secondary" id="btn-stop"><i class="bi bi-stop-fill"></i> Stop</button>
    <div class="t-divider"></div>
    <button class="btn-secondary" id="btn-export" title="Exporteer als JSON"><i class="bi bi-download"></i></button>
    <button class="btn-secondary" id="btn-import" title="Importeer JSON"><i class="bi bi-upload"></i></button>
    <span style="font-size:11px;color:#bbb;margin-left:6px;font-family:var(--mono)">p5 v2.0.2</span>
    <input type="file" id="file-import" accept=".json" style="display:none" />
    <div class="t-spacer"></div>
    <span id="profile-badge"></span>
    <button class="btn-secondary" id="btn-library" title="Blokbibliotheek"><i class="bi bi-grid-3x3-gap"></i></button>
    <button class="btn-secondary" id="btn-code"><i class="bi bi-code-slash"></i> Code</button>
    <button class="btn-secondary" id="btn-lang">EN</button>
    <div class="t-divider"></div>
    <select class="preset-select" id="preset-select"></select>
  </div>

  <!-- ── Body ──────────────────────────────────────────────────── -->
  <div id="body">

    <!-- Left: palette -->
    <div id="palette">
      <div id="cat-list"></div>
      <div id="block-list"></div>
    </div>

    <!-- Center: workspace -->
    <div id="workspace">
      <div id="zones">
        <div class="zone-wrap zone-vars">
          <div class="zone-header">
            <span class="kw-function" id="zone-vars-label">variabelen</span>
            <span class="kw-punc" id="zone-vars-sub">(globaal)</span>
          </div>
          <div class="zone-body" data-zone="vars"></div>
        </div>

        <div class="zone-wrap">
          <div class="zone-header">
            <span class="kw-function">function</span>
            <span class="kw-name">setup</span>
            <span class="kw-punc">() {</span>
          </div>
          <div class="zone-body" data-zone="setup"></div>
          <div class="zone-footer">}</div>
        </div>

        <div class="zone-wrap">
          <div class="zone-header">
            <span class="kw-function">function</span>
            <span class="kw-name">draw</span>
            <span class="kw-punc">() {</span>
          </div>
          <div class="zone-body" data-zone="draw"></div>
          <div class="zone-footer">}</div>
        </div>

        <div class="zone-wrap zone-klad">
          <div class="zone-header">
            <span class="kw-function" id="zone-klad-label">kladblok</span>
            <span class="kw-punc" id="zone-klad-sub">(geen code)</span>
          </div>
          <div class="zone-body" data-zone="kladblok"></div>
        </div>
      </div>

      <!-- Code panel (collapsible) -->
      <div id="code-panel" class="hidden">
        <div id="code-panel-header">Gegenereerde code</div>
        <pre id="code-pre"></pre>
        <button id="btn-copy-code"><i class="bi bi-clipboard"></i> Kopieer naar klembord</button>
      </div>
    </div>

    <!-- Right: preview -->
    <div id="preview">
      <div id="preview-header">
        <i class="bi bi-display"></i> Preview
      </div>
      <iframe id="preview-frame" sandbox="allow-scripts" title="p5.js preview"></iframe>
      <div id="error-bar" class="hidden"></div>
    </div>

  </div>
</div>

<div id="lib-backdrop"></div>
<div id="lib-overlay"></div>

<script src="app.js" defer></script>
</body>
</html>
